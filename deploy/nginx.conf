# CapRover/Docker: bez access logów (healthchecki, assety, boty = spam w logach)
access_log off;
# Only real errors: the long buffered-to-a-temporary-file warnings are gone (buffers sized for pictures)
error_log /dev/stderr error;

# Behind CapRover the TCP peer is its proxy, so recover the real client address from X-Forwarded-For
# (only when it comes from a private network) and overwrite the header we pass on: apps then trust
# exactly one hop (TRUSTED_PROXY_HOPS=1) and a client-sent X-Forwarded-For cannot spoof its address.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Which banner modes the configurator offers. Postgres is the source, Redis is the read cache.
    location = /api/catalog {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3s;
        proxy_connect_timeout 1s;
    }

    # Banner reads of FACEIT, cached per player for 15 seconds.
    location /api/faceit/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 10s;
        proxy_connect_timeout 2s;
    }

    # Lightweight in-memory heartbeat service for the live banner counter.
    location /api/presence {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        # The server answers the list and the pictures within about two seconds on its own; this is only the net under it.
        proxy_read_timeout 6s;
        proxy_connect_timeout 1s;
        # Pictures are tens of kilobytes: keep them in memory instead of a temp file
        proxy_buffer_size 64k;
        proxy_buffers 16 64k;
    }

    # Feedback board, screenshots and their admin routes: the Next.js app (web/).
    # admin/attachments must stay ahead of the auth location, which also matches /api/admin/.
    location ~ ^/api/(posts|attachments|profiles|admin/posts|admin/comments|admin/attachments|admin/profile-images)(/|$) {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 2s;
        client_max_body_size 2m;
    }

    # FACEIT login and the admin API (sessions in Redis, login history in PostgreSQL).
    location ~ ^/api/(auth|admin)/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 15s;
        proxy_connect_timeout 2s;
    }

    # Accounts, saved banners and cloud sync: the Next.js app (web/) on port 3100.
    location /api/me/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 15s;
        proxy_connect_timeout 2s;
    }

    location = /bannerfaceitobs {
        return 301 /wiki/bannerfaceit/;
    }

    location = /bannerfaceitobs/ {
        return 301 /wiki/bannerfaceit/;
    }

    location = /wiki {
        return 301 /wiki/;
    }

    location /wiki/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /docs {
        return 301 /docs/;
    }

    location = /en/docs {
        return 301 /en/docs/;
    }

    # Documentation is prerendered into plain HTML at build time (SSR)
    location /docs/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /en/docs/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # The same prerendered documentation in the other languages
    location ~ ^/(uk|ru|tr|pt|es|fr|cs)/docs$ {
        return 301 $uri/;
    }

    location ~ ^/(uk|ru|tr|pt|es|fr|cs)/docs/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # The OBS widget page has nothing to index
    location /widget/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /widget/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
