# CapRover/Docker: bez access logów (healthchecki, assety, boty = spam w logach)
access_log off;
error_log /dev/stderr warn;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Lightweight in-memory heartbeat service for the live banner counter.
    location = /api/presence {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3s;
        proxy_connect_timeout 1s;
    }

    location = /bannerfaceitobs {
        return 301 /wiki/bannerfaceit/;
    }

    location = /bannerfaceitobs/ {
        return 301 /wiki/bannerfaceit/;
    }

    location = /wiki {
        return 301 /wiki/;
    }

    location /wiki/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /docs {
        return 301 /docs/;
    }

    location = /en/docs {
        return 301 /en/docs/;
    }

    # Documentation is prerendered into plain HTML at build time (SSR)
    location /docs/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /en/docs/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # The OBS widget page has nothing to index
    location /widget/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /widget/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
