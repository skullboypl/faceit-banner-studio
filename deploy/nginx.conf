# CapRover/Docker: bez access logów (healthchecki, assety, boty = spam w logach)
access_log off;
error_log /dev/stderr warn;

# Behind CapRover the TCP peer is its proxy, so recover the real client address from X-Forwarded-For
# (only when it comes from a private network) and overwrite the header we pass on: apps then trust
# exactly one hop (TRUSTED_PROXY_HOPS=1) and a client-sent X-Forwarded-For cannot spoof its address.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Lightweight in-memory heartbeat service for the live banner counter.
    location /api/presence {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3s;
        proxy_connect_timeout 1s;
    }

    # Feedback board (posts, votes, comments) and its admin routes: the Next.js app (web/).
    location ~ ^/api/(posts|admin/posts|admin/comments)(/|$) {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 15s;
        proxy_connect_timeout 2s;
    }

    # FACEIT login and the admin API (sessions in Redis, login history in PostgreSQL).
    location ~ ^/api/(auth|admin)/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 15s;
        proxy_connect_timeout 2s;
    }

    # Accounts, saved banners and cloud sync: the Next.js app (web/) on port 3100.
    location /api/me/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 15s;
        proxy_connect_timeout 2s;
    }

    location = /bannerfaceitobs {
        return 301 /wiki/bannerfaceit/;
    }

    location = /bannerfaceitobs/ {
        return 301 /wiki/bannerfaceit/;
    }

    location = /wiki {
        return 301 /wiki/;
    }

    location /wiki/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /docs {
        return 301 /docs/;
    }

    location = /en/docs {
        return 301 /en/docs/;
    }

    # Documentation is prerendered into plain HTML at build time (SSR)
    location /docs/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /en/docs/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # The OBS widget page has nothing to index
    location /widget/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /widget/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
